<script>
/* Açılışta beyaz/boş ekran olmasın: son temanın rengi ilk boyamadan önce uygulanır */
(function () { try { var n = localStorage.getItem('hd2:themeName'), c = localStorage.getItem('hd2:themeColor');
  if (n) document.getElementById('splash').setAttribute('data-theme', n);
  if (c) document.querySelector('meta[name="theme-color"]').setAttribute('content', c); } catch (e) {} })();
</script>
